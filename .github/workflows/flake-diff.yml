name: flake-diff

on:
  pull_request:
    paths: [flake.lock]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: flake-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: macos-latest
    env:
      HOST: bprins-macbookair

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: bprins
          extraPullNames: catppuccin
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build base
        id: base
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" '${{ github.event.pull_request.base.sha }}'
          echo "path=$(nix build "path:$RUNNER_TEMP/base#homeConfigurations.$HOST.activationPackage" \
            --no-link --print-out-paths)" >> "$GITHUB_OUTPUT"

      - name: Build PR
        id: head
        run: |
          echo "path=$(nix build ".#homeConfigurations.$HOST.activationPackage" \
            --no-link --print-out-paths)" >> "$GITHUB_OUTPUT"

      - name: Diff closures
        run: |
          nix run --inputs-from . nixpkgs#nvd -- --color never diff \
            '${{ steps.base.outputs.path }}' '${{ steps.head.outputs.path }}' > nvd.txt

          {
            echo "### Package changes on \`$HOST\`"
            echo
            echo '```'
            # GitHub rejects comments over 65536 characters
            head -c 60000 nvd.txt
            echo '```'
            if [ "$(wc -c < nvd.txt)" -gt 60000 ]; then
              echo
              echo "_Output truncated. Run \`nvd diff\` locally for the full list._"
            fi
          } > comment.md

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: flake-diff
          path: comment.md
